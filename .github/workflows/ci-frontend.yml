name: CI - Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/frontend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/frontend/**"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: local/frontend:${{ github.sha }}

jobs:
  ci_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SonarQube (optional: will run only if vars/secrets exist)
      - name: SonarQube Scan (Frontend)
        if: ${{ vars.SONAR_HOST_URL != '' && secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=app-platform-frontend
            -Dsonar.sources=src/frontend
            -Dsonar.exclusions=**/.git/**,**/.github/**,**/k8s/**,**/*.md,**/infra/**

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (Frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (Frontend) - SARIF
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF (Frontend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
