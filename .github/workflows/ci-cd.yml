name: CI/CD (Quality + Security + Docker + GitOps)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  security-events: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: local/app-platform:${{ github.sha }}

jobs:
  ci:
    name: CI (Quality + Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- SonarQube ----------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=app-platform
            -Dsonar.sources=.
            -Dsonar.exclusions=**/.git/**,**/.github/**,**/k8s/**,**/*.md,**/infra/**

      # ---------- OWASP Dependency Check ----------
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "app-platform"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

      # ---------- Docker Build (local for scanning) ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- Trivy Scan ----------
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  cd_gitops:
    name: CD (ECR Push + GitOps Update)
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 0) Validate required inputs exist (from teammate repo settings)
      - name: Check CD inputs exist
        id: check
        shell: bash
        run: |
          set -e
          missing=""
          [[ -z "${{ secrets.AWS_ROLE_ARN }}" ]] && missing="$missing AWS_ROLE_ARN"
          [[ -z "${{ vars.AWS_REGION }}" ]] && missing="$missing AWS_REGION"
          [[ -z "${{ vars.ECR_REGISTRY }}" ]] && missing="$missing ECR_REGISTRY"
          [[ -z "${{ vars.ECR_REPOSITORY }}" ]] && missing="$missing ECR_REPOSITORY"

          if [[ -n "$missing" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CD inputs missing:$missing -> skipping CD."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 1) Configure AWS credentials via OIDC
      - name: Configure AWS credentials (OIDC)
        if: steps.check.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 2) Login to ECR
      - name: Login to Amazon ECR
        if: steps.check.outputs.skip == 'false'
        uses: aws-actions/amazon-ecr-login@v2

      # 3) Build & Push to ECR (tag = commit sha)
      - name: Build & Push image to ECR
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4) Update kustomize overlays (dev + prod) to new image
      - name: Install yq
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -e
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update kustomize image (dev + prod)
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          ECR_IMAGE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for FILE in k8s/overlays/dev/kustomization.yaml k8s/overlays/prod/kustomization.yaml; do
            echo "Updating $FILE -> ${ECR_IMAGE}:${TAG}"

            # update images[0].newName and images[0].newTag
            yq -i '.images[0].newName = strenv(ECR_IMAGE)' "$FILE"
            yq -i '.images[0].newTag  = strenv(TAG)' "$FILE"

            echo "Result:"
            yq '.images' "$FILE"
          done


      # 5) Commit & push GitOps change
      - name: Commit & push GitOps change
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/dev/kustomization.yaml k8s/overlays/prod/kustomization.yaml
          git commit -m "gitops: deploy ${GITHUB_SHA}" || echo "No changes to commit"
          git push