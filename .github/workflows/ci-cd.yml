name: CI (Quality + Security + Docker)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  security-events: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: local/app-platform:${{ github.sha }}

jobs:
  security_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SonarQube Scan (self-hosted)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=app-platform
            -Dsonar.sources=.
            -Dsonar.exclusions=**/.git/**,**/.github/**,**/k8s/**,**/*.md,**/infra/**
            -Dsonar.scanner.userAgent=github-actions-sonar

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "app-platform"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  push_and_gitops:
    name: CD (ECR Push + GitOps Update)
    needs: security_and_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CD inputs exist
        id: check
        shell: bash
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_ARN }}" || -z "${{ vars.AWS_REGION }}" || -z "${{ vars.ECR_REGISTRY }}" || -z "${{ vars.ECR_REPOSITORY }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CD inputs missing -> skipping CD."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.check.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check.outputs.skip == 'false'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image to ECR
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update k8s dev overlay image (newName/newTag)
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          FILE="k8s/overlays/dev/kustomization.yaml"

          python - <<PY
import re
from pathlib import Path

p = Path("$FILE")
s = p.read_text(encoding="utf-8")

s = re.sub(r'(^\s*newName:\s*).+$', r'\1${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}', s, flags=re.M)
s = re.sub(r'(^\s*newTag:\s*).+$', r'\1${{ github.sha }}', s, flags=re.M)

p.write_text(s, encoding="utf-8")
PY

          echo "Updated:"
          grep -nE 'newName:|newTag:' "$FILE"

      - name: Commit & push GitOps change
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "gitops: deploy ${GITHUB_SHA} to dev" || echo "No changes to commit"
          git push
