name: CI - Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/backend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/backend/**"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: local/backend:${{ github.sha }}

jobs:
  ci_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

        env:
        with:
          args: >

      - name: OWASP Dependency-Check (Backend)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "app-platform-backend"
          path: "src/backend"
          format: "HTML"
          out: "dependency-check-backend"

      - name: Upload OWASP report (GitHub Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check-report
          path: dependency-check-backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (Backend)
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (Backend) - SARIF
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF (Backend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
